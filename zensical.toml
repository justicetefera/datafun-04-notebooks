# ============================================================
# zensical.toml (Zensical configuration file)
# ============================================================

# WHY: Centralizes project documentation configuration.
# Zensical is a drop-in replacement for MkDocs that provides AI-assisted
# docstring generation and enhanced documentation features.

[project]
site_name = "Project Documentation"
site_url = "https://justicetefera.github.io/datafun-04-notebooks/"
repo_url = "https://github.com/justicetefera/datafun-04-notebooks"
repo_name = "justicetefera/datafun-04-notebooks"
site_description = "Project Documentation"
docs_dir = "docs"
site_dir = "site"
edit_uri = "edit/main/docs/"

[project.extra]
# WHY: Social links provide easy access to project repositories and profiles.
social = [
    { icon = "fontawesome/brands/github", link = "https://github.com/justicetefera/datafun-04-notebooks" },
]

# ------------------------------------------------------------
# Plugins
# ------------------------------------------------------------
[project.plugins.search]
lang = "en"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = true
show_root_heading = true
show_root_toc_entry = true
show_signature_annotations = true
separate_signature = true

# ------------------------------------------------------------
# Theme
# ------------------------------------------------------------
[project.theme]
features = [
    "navigation.tracking",
    "navigation.expand",
    "navigation.path",
    "navigation.prune",
    "navigation.indexes",
    "toc.follow",
    "toc.integrate",
    "navigation.top",
]

# ------------------------------------------------------------
# Navigation
# ------------------------------------------------------------
nav = [
    { "Home" = "index.md" },
    { "Project Instructions" = "project-instructions.md" },
    { "Your Files" = "your-files.md" },
    { "Glossary" = "glossary.md" },
    { "Variables" = "module/variables.md" },
]
